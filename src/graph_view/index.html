<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Knowledge Map 3D View</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #030311; }
        #3d-graph { width: 100vw; height: 100vh; }
        
        .info-panel {
            position: absolute; top: 15px; left: 15px; color: white;
            font-family: sans-serif; background: rgba(0,0,0,0.8); padding: 15px;
            border-radius: 8px; border: 1px solid #444; max-width: 350px;
            pointer-events: none; z-index: 10;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
            transition: border-color 0.2s;
        }
        
        .info-panel::-webkit-scrollbar { width: 8px; }
        .info-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        .info-panel::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
        .info-panel::-webkit-scrollbar-thumb:hover { background: #888; }
        
        .legend {
            position: absolute; bottom: 15px; left: 15px; color: white;
            font-family: sans-serif; background: rgba(0,0,0,0.8); padding: 10px;
            border-radius: 8px; border: 1px solid #444;
            z-index: 20;
        }

        .legend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 12px;
        }
        .legend-header-title { font-size: 12px; color: #aaa; }

        .legend-footer {
            margin-top: 10px;
            border-top: 1px solid #555;
            padding-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #reset-focus-btn {
            flex: 1; padding: 6px; background: #333; color: white;
            border: 1px solid #555; border-radius: 4px; cursor: pointer;
            font-size: 12px; transition: background 0.2s;
        }
        #reset-focus-btn:hover { background: #555; }

        #legend-toggle-btn {
            background: #333; color: white; border: 1px solid #555;
            border-radius: 4px; cursor: pointer;
            width: 26px; height: 26px;
            font-size: 16px; font-weight: bold; line-height: 1;
            padding: 0;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: background 0.2s;
        }
        #legend-toggle-btn:hover { background: #555; }

        .legend.minimized .legend-collapsible { display: none; }
        .legend.minimized .legend-header { display: none; }
        .legend.minimized .legend-footer {
            margin-top: 0; border-top: none; padding-top: 0;
        }

        .legend-item {
            display: flex; align-items: center; margin: 8px 0; font-size: 14px;
            cursor: pointer; transition: opacity 0.2s;
            padding: 4px; border-radius: 4px;
        }
        .legend-item:hover { background: rgba(255,255,255,0.1); }
        .color-box { width: 16px; height: 16px; margin-right: 12px; border-radius: 50%; }
        
        .controls {
            position: absolute; bottom: 15px; right: 15px; color: white;
            font-family: sans-serif; background: rgba(0,0,0,0.8); padding: 15px;
            border-radius: 8px; border: 1px solid #444; z-index: 10;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        
        h3 { margin-top: 0; margin-bottom: 10px; font-size: 18px; border-bottom: 1px solid #555; padding-bottom: 5px;}
        p { margin: 5px 0; font-size: 14px; line-height: 1.4;}
        input[type=range] { width: 150px; cursor: pointer; }
        
        #node-relations { margin-top: 15px; font-size: 12px; border-top: 1px solid #555; padding-top: 10px; }
        .relation-item { margin-bottom: 10px; background: rgba(255,255,255,0.1); padding: 6px; border-radius: 4px;}
        .relation-target { color: #ffeb3b; font-weight: bold; display: block; margin-bottom: 3px;}

        /* Category Influence パネル (右上) */
        .category-panel {
            position: absolute; top: 15px; right: 15px;
            color: white; font-family: sans-serif;
            background: rgba(0,0,0,0.8); padding: 12px;
            border-radius: 8px; border: 1px solid #444;
            z-index: 15;
            width: 230px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .category-panel::-webkit-scrollbar { width: 8px; }
        .category-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        .category-panel::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }

        .category-panel-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffd54f;
            border-bottom: 1px solid #555;
            padding-bottom: 6px;
        }
        .category-panel-desc {
            font-size: 10px;
            color: #888;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }
        .category-btn {
            background: #2a2a2a;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: background 0.2s, border-color 0.2s;
        }
        .category-btn:hover { background: #3d3d3d; }
        .category-btn.active {
            background: #ffd54f;
            color: #000;
            border-color: #ffd54f;
            font-weight: bold;
        }
        .category-count {
            float: right;
            font-size: 10px;
            opacity: 0.7;
        }
        .category-btn.active .category-count { opacity: 1; }

        #clear-category-btn {
            width: 100%;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: background 0.2s;
        }
        #clear-category-btn:hover { background: #555; }
        #clear-category-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
    <!-- ★修正: THREE.js を読み込む -->
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>
    <div id="3d-graph"></div>
    
    <div class="info-panel" id="info-panel">
        <h3>Node Info</h3>
        <p id="node-type" style="color: #aaa; font-weight: bold;"></p>
        <p id="node-name">ノードにホバーしてください</p>
        <p style="color: #888; font-size: 11px; margin-top: 10px;">
            ※ 左クリック：関連ツリーを表示<br>
            ※ 右クリック：カメラ移動（フォーカス）<br>
            <strong style="color:#ffeb3b;">※ Shiftキー長押し：パネル固定＆ホイールでスクロール</strong>
        </p>
        <div id="node-relations"></div>
    </div>
    
    <div class="legend" id="legend">
        <div class="legend-header">
            <span class="legend-header-title">※クリックでレイヤー強調</span>
        </div>
        <div class="legend-collapsible">
            <div class="legend-item" data-group="3">
                <div class="color-box" style="background: #ff4d4d;"></div>Cluster (抽象・上位層)
            </div>
            <div class="legend-item" data-group="2">
                <div class="color-box" style="background: #4da6ff;"></div>Keyword (中間層)
            </div>
            <div class="legend-item" data-group="1">
                <div class="color-box" style="background: #4dff4d;"></div>Patent (具体・下層)
            </div>
        </div>
        <div class="legend-footer">
            <button id="reset-focus-btn">アテンション解除</button>
            <button id="legend-toggle-btn" title="最小化 / 展開">−</button>
        </div>
    </div>

    <!-- Category Influence パネル (Glow表現に固定) -->
    <div class="category-panel" id="category-panel">
        <div class="category-panel-title">🎯 Category Influence</div>
        <div class="category-panel-desc">
            カテゴリを選択すると、影響度に応じてノードが白く輝きます
        </div>

        <div class="category-list" id="category-list">
            <!-- 動的生成 -->
        </div>

        <button id="clear-category-btn" disabled>選択解除</button>
    </div>
    
    <div class="controls">
        <label for="z-distance-slider" style="font-size: 14px; margin-bottom: 8px;">
            レイヤー間距離: <span id="z-dist-val">500</span>
        </label>
        <input type="range" id="z-distance-slider" min="0" max="2400" value="500" step="20">
    </div>

    <script src="main.js"></script>
</body>
</html>
